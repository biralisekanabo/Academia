<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Eduplex</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 25% 20%, #241b4d, #0f0f1a 62%);
        color: #f4f3ff;
      }
      .contenu { display: grid; justify-items: center; gap: 1.25rem; text-align: center; padding: 2rem; }
      .logo {
        width: 5rem; height: 5rem; display: grid; place-items: center;
        border-radius: 1.5rem; overflow: hidden;
        background: #fff; box-shadow: 0 20px 45px -18px rgba(109, 74, 255, 0.8);
      }
      .logo img { width: 82%; height: 82%; object-fit: contain; }
      .nom { font-size: 1.6rem; font-weight: 800; letter-spacing: 0.16em; }
      .barre {
        position: relative; width: 12rem; height: 4px; border-radius: 9999px;
        background: rgba(255, 255, 255, 0.14); overflow: hidden;
      }
      .barre::after {
        content: ""; position: absolute; inset: 0;
        background: linear-gradient(90deg, #6d4aff, #3aa0ff, #35e0d6);
        transform: translateX(-100%);
        animation: charge 1.1s ease-in-out infinite;
      }
      @keyframes charge { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      p { margin: 0; color: #b9b6d6; font-size: 0.9rem; }
    </style>
  </head>
  <body>
    <div class="contenu">
      <div class="logo"><img src="eduplex-logo.svg" alt="Eduplex" /></div>
      <div class="nom">EDUPLEX</div>
      <div class="barre"></div>
      <p>Chargement de votre espace…</p>
    </div>
  </body>
</html>
