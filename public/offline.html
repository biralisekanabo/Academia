<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Academia — Hors ligne</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(circle at 30% 20%, #241b4d, #0f0f1a 60%);
        color: #f4f3ff;
        text-align: center;
        padding: 2rem;
      }
      .carte {
        max-width: 26rem;
        padding: 2.5rem 2rem;
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(12px);
      }
      .pastille {
        width: 4rem;
        height: 4rem;
        margin: 0 auto 1.25rem;
        display: grid;
        place-items: center;
        border-radius: 1.25rem;
        font-size: 2rem;
        background: linear-gradient(135deg, #6d4aff, #3aa0ff, #35e0d6);
      }
      h1 { font-size: 1.35rem; margin: 0 0 0.5rem; }
      p { margin: 0; color: #b9b6d6; line-height: 1.6; font-size: 0.95rem; }
      button {
        margin-top: 1.5rem;
        padding: 0.7rem 1.4rem;
        border: 0;
        border-radius: 0.75rem;
        font-size: 0.9rem;
        font-weight: 600;
        color: #fff;
        cursor: pointer;
        background: linear-gradient(135deg, #6d4aff, #3aa0ff);
      }
    </style>
  </head>
  <body>
    <div class="carte">
      <div class="pastille">📡</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Impossible de joindre Academia pour le moment. Vérifiez votre connexion puis réessayez.</p>
      <button onclick="location.reload()">Réessayer</button>
    </div>
  </body>
</html>
